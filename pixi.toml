[workspace]
authors = ["Dan Rosenbaum <danro@cs.haifa.ac.il>"]
channels = ["conda-forge"]
name = "flowNP"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.13.5,<3.14"
pyyaml = ">=6.0.2,<7"
matplotlib = ">=3.10.5,<4"
tqdm = ">=4.67.1,<5"
addict = ">=2.4.0,<3"
xarray = ">=2025.8.0,<2026"
prettytable = ">=3.16.0,<4"
torchvision = ">=0.23.0,<0.24"
pytorch = ">=2.7.1,<3"

[pypi-dependencies]
attrdictionary = ">=1.0.0, <2"
flow-matching = ">=1.0.10, <2"

[feature.gpu.system-requirements]
cuda = "12.6"

[feature.gpu.target.linux-64.dependencies]
pytorch-gpu = ">=2.7.1,<3"

[environments]
gpu = ["gpu"]

[tasks]
start = "python gp.py --kernel=rbf --expname=test --expid=1 --model=fnp"

[feature.gpu.tasks]
start = "python gp.py --kernel=rbf --expname=test --expid=1 --model=fnp"
